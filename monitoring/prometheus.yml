global:
	scrape_interval: 15s

scrape_configs:
	- job_name: expense-app
		static_configs:
			- targets: ['expense-app:9200']
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: expense-app
    static_configs:
      - targets: ['app:9200']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']